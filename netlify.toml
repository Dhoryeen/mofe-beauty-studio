# Netlify deployment for the Next.js app (App Router).
# Build settings only — keep this file minimal.
# Set NODE_VERSION=20 in the Netlify UI (Site settings → Environment variables).
[build]
  command = "npm run build"
  publish = ".next"

# The service worker must always revalidate: a cached sw.js would pin
# clients to stale offline behaviour.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
